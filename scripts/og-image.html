<!doctype html>
<!--
  Link preview poster (WhatsApp, Facebook, X) -> public/og.png, 1200x630.
  Remake it after changing this file (from the repo root, after npm install). Fonts only load over http, not file://:
    python -m http.server 8765
    chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=3000 --screenshot=public/og.png http://localhost:8765/scripts/og-image.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bungee'; src: url(../node_modules/@fontsource/bungee/files/bungee-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Anek'; font-weight: 100 800; src: url(../node_modules/@fontsource-variable/anek-bangla/files/anek-bangla-latin-wght-normal.woff2) format('woff2-variations'); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'Anek'; font-weight: 100 800; src: url(../node_modules/@fontsource-variable/anek-bangla/files/anek-bangla-bengali-wght-normal.woff2) format('woff2-variations'); unicode-range: U+0980-09FE, U+200C-200D; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1A0B07; }
  .poster { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #F4E3C1; color: #1A0B07; font-family: 'Anek', sans-serif; }
  .rays { position: absolute; left: 50%; top: 45%; width: 2600px; height: 2600px; transform: translate(-50%, -50%); background: repeating-conic-gradient(#FFD21F 0deg 7deg, #FF9F1A 7deg 14deg); }
  .vignette { position: absolute; inset: 0; background: radial-gradient(120% 90% at 45% 45%, transparent 55%, rgba(196,22,28,.55) 100%); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(26,11,7,.16) 1.2px, transparent 1.6px); background-size: 7px 7px; }
  .frame { position: absolute; inset: 0; z-index: 5; box-shadow: inset 0 0 0 12px #C4161C, inset 0 0 0 17px #1A0B07, inset 0 0 0 25px #FFD21F, inset 0 0 0 29px #1A0B07; }
  .copy { position: absolute; left: 78px; top: 46px; z-index: 3; }
  .kicker { font-family: 'Bungee'; color: #C4161C; font-size: 26px; margin: 0; }
  h1 { margin: 14px 0 0; font-weight: 800; font-variation-settings: "wdth" 75; line-height: .9; color: #FFD21F; font-size: 150px; white-space: nowrap; }
  h1 .en { font-family: 'Bungee'; font-size: .62em; font-weight: 400; }
  .tag { margin: 16px 0 0; font-size: 46px; font-weight: 800; }
  .sub { margin: 6px 0 0; font-size: 28px; font-weight: 500; }
  .art { position: absolute; z-index: 3; filter: drop-shadow(8px 11px 0 rgba(26,11,7,.85)); }
  .star { position: absolute; z-index: 4; right: 330px; top: 50px; width: 150px; height: 150px; display: grid; place-items: center; text-align: center; background: #C4161C; color: #FFD21F; font-family: 'Bungee'; font-size: 27px; line-height: 1;
    clip-path: polygon(50% 0%,61% 14%,79% 9%,79% 28%,96% 35%,85% 50%,96% 65%,79% 72%,79% 91%,61% 86%,50% 100%,39% 86%,21% 91%,21% 72%,4% 65%,15% 50%,4% 35%,21% 28%,21% 9%,39% 14%); }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; height: 78px; padding-bottom: 26px; display: flex; align-items: center; justify-content: center; background: #1A0B07; color: #F4E3C1; font-size: 30px; font-variation-settings: "wdth" 75; }
  .foot b { color: #FFD21F; }
</style>
</head>
<body>
<div class="poster">
  <div class="rays"></div><div class="vignette"></div><div class="dots"></div>
  <div class="copy">
    <p class="kicker">DHAKAR SOBJI CINEMA PRESENTS</p>
    <h1 id="title"><span class="en">THOKAR</span><br>চান্স <span class="en">NAI</span></h1>
    <p class="tag">Ajker bazar er ashol দাম.</p>
    <p class="sub">Dhakar sobji, shak, fol ar moshla er dam, protidin.</p>
  </div>
  <img class="art" src="../src/assets/potato.svg" style="width:330px; right:70px; top:150px; transform: rotate(-12deg)" alt="">
  <img class="art" src="../src/assets/chili.svg" style="width:150px; right:40px; top:40px; transform: rotate(-30deg)" alt="">
  <img class="art" src="../src/assets/malta.svg" style="width:120px; right:360px; bottom:100px; transform: rotate(12deg)" alt="">
  <img class="art" src="../src/assets/onion.svg" style="width:110px; right:50px; bottom:96px; transform: rotate(6deg)" alt="">
  <div class="star">SUPER<br>HIT!</div>
  <div class="foot"><span>Starring <b>ALU</b> · <b>PEYAJ</b> · <b>KACHA MORICH</b> · <b>MALTA</b> · and introducing <b>লাল শাক</b></span></div>
  <div class="frame"></div>
</div>
<script>
  // Same solid outline + red extrusion as extrude() in src/cinema/common.tsx
  const w = '0.035em', ring = Array.from({ length: 16 }, (_, k) => { const a = (k / 16) * Math.PI * 2; return `calc(${w} * ${Math.cos(a).toFixed(3)}) calc(${w} * ${Math.sin(a).toFixed(3)}) 0 #1A0B07` })
  const ext = Array.from({ length: 7 }, (_, k) => `calc(${w} + ${k + 1}px) calc(${w} + ${k + 1}px) 0 #C4161C`)
  document.getElementById('title').style.textShadow = [...ring, ...ext, `calc(${w} + 9px) calc(${w} + 10px) 0 #1A0B07`].join(',')
</script>
</body>
</html>
