name: Source diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DAM ajax flow
        shell: bash
        run: |
          set +e
          B=https://market.dam.gov.bd
          curl -sS --max-time 30 -A "Mozilla/5.0" "$B/global/js/functions.js?v=2.1" -o /tmp/f.js
          grep -nE "function (district|subdistrict|market)_ajax_call\b|function (district|subdistrict|market)_ajax_call\(" /tmp/f.js
          for f in district_ajax_call subdistrict_ajax_call market_ajax_call; do L=$(grep -nE "function $f\(" /tmp/f.js | head -1 | cut -d: -f1); [ -n "$L" ] && sed -n "${L},$((L+22))p" /tmp/f.js | cut -c1-200; echo ----; done
          sed -n '215,232p' /tmp/f.js
