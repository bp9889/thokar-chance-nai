name: Source diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install --no-save @e965/xlsx@0.20.3
      - name: Chains
        shell: bash
        run: |
          set +e; : > /tmp/extra-ca.pem
          for h in tcb.gov.bd dam.gov.bd; do echo | openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 > /tmp/leaf.pem 2>/dev/null; AIA=$(openssl x509 -in /tmp/leaf.pem -noout -text 2>/dev/null | grep -oE "CA Issuers - URI:[^ ]+" | head -1 | sed 's/CA Issuers - URI://'); [ -n "$AIA" ] && curl -sS --max-time 20 "$AIA" -o /tmp/i.der && (openssl x509 -inform DER -in /tmp/i.der 2>/dev/null || cat /tmp/i.der) >> /tmp/extra-ca.pem; done
          echo "NODE_EXTRA_CA_CERTS=/tmp/extra-ca.pem" >> $GITHUB_ENV
      - run: node scripts/update-prices.mjs
        env: { DEBUG: '1', DRY: '1' }
