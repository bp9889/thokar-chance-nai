name: Source diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: DAM page internals
        shell: bash
        run: |
          set +e
          curl -sS --max-time 40 -A "Mozilla/5.0" -c /tmp/cj https://market.dam.gov.bd/market_daily_price_report -o /tmp/dam.html
          echo "size: $(wc -c < /tmp/dam.html)"
          grep -oiE '<script[^>]*src="[^"]+"' /tmp/dam.html
          echo "--- inline script lines mentioning ajax/url/district/market"
          grep -nE "ajax|url|District|district|Market_id|market_id|\.change|route\(|/get|json" /tmp/dam.html | grep -v "<link" | cut -c1-220 | head -60
          echo "--- form"
          grep -nE "<form|_token|type=\"submit\"|name=\"date|datepicker|PriceType|Division_id" /tmp/dam.html | cut -c1-220 | head -20
